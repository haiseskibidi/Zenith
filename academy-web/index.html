<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zenith Academy: Портал низкоуровневой разработки</title>
  <!-- Google Fonts: Geist для текста, JetBrains Mono для кода -->
